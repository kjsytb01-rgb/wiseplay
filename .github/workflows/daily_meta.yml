name: FC Online Daily Meta Pipeline

on:
  schedule:
    # UTC 기준 23:00 = 한국 시간(KST) 매일 아침 08:00 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 버튼 활성화

permissions:
  contents: write

jobs:
  run-meta-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 및 Playwright 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: 메타 분석 파이프라인 가동 (Playwright 크롤링 + 넥슨 API)
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          python main.py

      - name: data/meta_today.json 깃허브 자동 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta_today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 8:00 AM FC Online 천상계 메타 자동 갱신 [skip ci]" && git push)
