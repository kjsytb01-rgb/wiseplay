name: FC Online Daily Meta Pipeline

on:
  schedule:
    # 한국 시간(KST) 매일 아침 08:00 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-meta-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 및 Chromium 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: 메타 수집 파이프라인 가동
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          python main.py

      - name: 생성된 데이터 깃허브 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta_today.json
          git diff --staged --quiet || (git commit -m "chore: 8:00 AM Daily Meta 자동 갱신 [skip ci]" && git push)
