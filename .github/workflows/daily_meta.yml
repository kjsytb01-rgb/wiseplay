name: FC Online Daily Meta Pipeline

on:
  schedule:
    - cron: '0 23 * * *' # 매일 한국시간 오전 8시 (UTC 23:00)
  workflow_dispatch:      # 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 및 헤드리스 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: 실시간 1~100위 메타 전수 수집 스크립트 실행
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          python main.py

      - name: 데이터 변경사항 깃허브 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta_today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real top 100 meta [$(date '+%Y-%m-%d %H:%M:%S')]" && git push)
