<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISEPLAY - Super Champions Daily Meta (FIFA CAMPER X LJ Lee)</title>
  <style>
    :root {
      --bg-dark: #0f1115;
      --card-bg: #1a1d24;
      --card-border: #2a2e39;
      --accent-color: #00ff88;
      --accent-blue: #00b4d8;
      --accent-gold: #ffbb00;
      --text-main: #f0f2f5;
      --text-muted: #8b949e;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* 상단 헤더 */
    header {
      background: radial-gradient(circle at center top, rgba(0, 255, 136, 0.08) 0%, rgba(15, 17, 21, 0.98) 75%);
      border-bottom: 1px solid var(--card-border);
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* 다국어 언어 셀렉터 (우측 상단) */
    .lang-selector-wrap {
      position: absolute;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 6px;
      background: #14171f;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .lang-btn:hover { color: #fff; }
    .lang-btn.active {
      background: var(--card-border);
      color: var(--accent-color);
    }

    .brand-link {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.25s ease;
      margin-top: 10px;
    }
    .brand-link:hover { transform: scale(1.02); }

    .brand-logo {
      width: 100%;
      max-width: 680px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0, 255, 136, 0.25));
    }

    .brand-sub {
      font-size: 0.85rem;
      color: #9ba3af;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* 네비게이션 탭 메뉴 */
    .nav-tabs {
      display: inline-flex;
      gap: 10px;
      margin-top: 18px;
      background: #14171f;
      padding: 5px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.meta-btn.active {
      background: var(--accent-blue);
      color: #0b0d11;
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.25);
    }

    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 16px;
    }

    /* 상단 배너 */
    .meta-top-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161920;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .meta-title-area h2 {
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .meta-title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .badge-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .badge-time {
      background: rgba(0, 255, 136, 0.12);
      color: var(--accent-color);
      border: 1px solid rgba(0, 255, 136, 0.3);
    }
    .badge-sample {
      background: rgba(0, 180, 216, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 180, 216, 0.3);
    }

    /* 포메이션 메타 카드 */
    .formation-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .formation-card:hover {
      border-color: var(--accent-color);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .form-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }
    .form-share {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent-color);
    }
    
    .gauge-bg {
      width: 100%;
      height: 7px;
      background: #11141a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #232732;
    }
    .gauge-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-blue));
      border-radius: 4px;
    }

    .meta-sub-header {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tactics-route-list {
      list-style: none;
      margin-bottom: 16px;
    }
    .tactics-route-list li {
      font-size: 0.9rem;
      color: #d1d5db;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tactics-route-list li::before {
      content: "▶";
      color: var(--accent-color);
      font-size: 0.65rem;
    }

    .key-player-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .player-tag {
      background: #12151c;
      border: 1px solid #282d3b;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #f0f2f5;
    }
    .player-tag b {
      color: var(--accent-blue);
      margin-right: 6px;
    }

    .ranker-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ranker-chip {
      background: #12151c;
      border: 1px solid #282d3b;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .ranker-chip:hover {
      background: var(--accent-color);
      color: #0b0d11;
      border-color: var(--accent-color);
      font-weight: 700;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-color);
      color: #0b0d11;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10000;
    }
    #toast.show { opacity: 1; }

    .loading-box {
      text-align: center;
      padding: 70px 0;
      color: var(--text-muted);
    }
  </style>
</head>

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('wiseplay_lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(lang));
      });
      applyI18n();
      if (metaCachedData) renderMetaCards(metaCachedData);
    }

      const t = I18N[currentLang] || I18N.ko;
      document.getElementById('t-nav-tactics').innerText = t.navTactics;
      document.getElementById('t-nav-controller').innerText = t.navController;
      document.getElementById('t-nav-meta').innerText = t.navMeta;
      document.getElementById('t-banner-title').innerText = t.bannerTitle;
      document.getElementById('badge-update-status').innerText = t.badgeTime;
      document.getElementById('meta-updated-time').innerText = t.bannerDesc;
      const loadEl = document.getElementById('t-loading');
      if (loadEl) loadEl.innerText = t.loading;
    }

    async function loadRealMeta() {
      try {
        const res = await fetch('/data/meta_today.json?t=' + Date.now());
        if (!res.ok) throw new Error("Fetch error");
        metaCachedData = await res.json();
        renderMetaCards(metaCachedData);
      } catch (err) {
        console.error(err);
        document.getElementById('meta-list-container').innerHTML = 
          `<div class="loading-box" style="color:#ff6b6b;">Error loading meta data. Please refresh.</div>`;
      }
    }

    function renderMetaCards(data) {
      const t = I18N[currentLang] || I18N.ko;
      document.getElementById('sample-count').innerText = t.sampleSuffix.replace('{n}', data.total_rankers);

      const container = document.getElementById('meta-list-container');
      container.innerHTML = '';

      data.meta_list.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'formation-card';

        const playersHtml = Object.entries(item.key_players || {})
          .map(([pos, name]) => `<span class="player-tag"><b>${pos}</b> ${name}</span>`)
          .join('');

        // 언어별 전술 루트 매핑 (사전에 정의된 다국어 텍스트 우선, 없을 시 원본)
        const routesList = (t.routes && t.routes[item.formation]) || item.tactical_routes || [];
        const routesHtml = routesList.map(r => `<li>${r}</li>`).join('');

        const rankersHtml = (item.recommended_rankers || [])
          .map(nick => `<button class="ranker-chip" onclick="copyRankerNick('${nick}')">📋 ${nick}</button>`)
          .join('');

        card.innerHTML = `
          <div class="card-top">
            <div class="form-title">${item.formation} <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal;">(${item.count} ${t.rankerCount})</span></div>
            <div class="form-share">${item.share}%</div>
          </div>
          <div class="gauge-bg">
            <div class="gauge-fill" style="width: ${item.share}%;"></div>
          </div>
          <div class="meta-sub-header">${t.secRoutes}</div>
          <ul class="tactics-route-list">${routesHtml}</ul>
          <div class="meta-sub-header">${t.secPlayers}</div>
          <div class="key-player-row">${playersHtml}</div>
          <div class="meta-sub-header">${t.secRankers}</div>
          <div class="ranker-chips-wrap">${rankersHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    function copyRankerNick(nick) {
      const t = I18N[currentLang] || I18N.ko;
      navigator.clipboard.writeText(nick).then(() => {
        const toast = document.getElementById('toast');
        toast.innerText = t.toastCopy.replace('{name}', nick);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLang(currentLang);
      loadRealMeta();
    });
  </script>
</body>
</html>
