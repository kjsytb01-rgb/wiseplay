<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISEPLAY - FC 온라인 실시간 데일리 메타</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --accent-color: #00ff88;
      --text-main: #ffffff;
      --text-muted: #8b949e;
      --border-color: #232a36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
    
    /* 네비게이션 헤더 */
    header { background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
    .logo { font-size: 1.3rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent-color); }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent-color); }

    /* 메인 콘텐츠 */
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .meta-header { margin-bottom: 30px; text-align: center; }
    .meta-header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .meta-badge-wrap { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .badge-live { background: rgba(0, 255, 136, 0.15); color: var(--accent-color); border: 1px solid rgba(0, 255, 136, 0.3); }
    .badge-sample { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

    /* 포메이션 카드 */
    .formation-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .formation-title { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .formation-share { font-size: 1.2rem; font-weight: 800; color: var(--accent-color); }
    
    /* 게이지 바 */
    .bar-bg { width: 100%; height: 8px; background: #232a36; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00bdff); border-radius: 4px; }

    /* 추천 선수 및 루트 */
    .meta-section-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .routes-list { list-style: none; margin-bottom: 18px; }
    .routes-list li { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .routes-list li i { color: var(--accent-color); font-size: 0.8rem; }

    .key-players { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .player-tag { background: #1c2333; border: 1px solid #2d3748; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; color: #e2e8f0; }
    .player-tag b { color: #38bdf8; margin-right: 4px; }

    /* 랭커 닉네임 칩 */
    .ranker-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: #fff; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .chip:hover { background: #334155; border-color: var(--accent-color); color: var(--accent-color); }
    .chip i { font-size: 0.75rem; color: var(--text-muted); }

    /* 토스트 알림 */
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #00ff88; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="/" class="logo"><i class="fa-solid fa-gamepad"></i> WISE<span>PLAY</span></a>
      <nav class="nav-links">
        <a href="/#tactics"><i class="fa-solid fa-futbol"></i> 전술 추천</a>
        <a href="/#controller"><i class="fa-solid fa-gamepad"></i> 컨트롤러 추천</a>
        <a href="/meta" class="active"><i class="fa-solid fa-fire"></i> Daily Meta</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="meta-header">
      <h1>실시간 슈퍼챔피언스 메타 통계</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">넥슨 공식 데이터센터 실시간 1~100위 전수 실측 집계</p>
      <div class="meta-badge-wrap">
        <span class="badge badge-live"><i class="fa-solid fa-circle-dot"></i> LIVE</span>
        <span class="badge badge-sample" id="sample-count">공식 1vs1 TOP 100명 표본</span>
      </div>
    </div>

    <div id="meta-container">
      <!-- 자바스크립트로 메타 카드 동적 로드 -->
      <div style="text-align: center; color: var(--text-muted); padding: 60px 0;">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 12px;">실시간 메타 데이터를 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <div id="toast">구단주명이 복사되었습니다!</div>

  <script>
    async function loadMeta() {
      try {
        const res = await fetch('/data/meta_today.json?t=' + Date.now());
        if (!res.ok) throw new Error("데이터 수신 실패");
        const data = await res.json();

        document.getElementById('sample-count').innerText = `공식 1vs1 TOP ${data.total_rankers}명 전수 표본`;

        const container = document.getElementById('meta-container');
        container.innerHTML = '';

        data.meta_list.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'formation-card';

          const playersHtml = Object.entries(item.key_players || {})
            .map(([pos, name]) => `<span class="player-tag"><b>${pos}</b>${name}</span>`)
            .join('');

          const routesHtml = (item.tactical_routes || [])
            .map(r => `<li><i class="fa-solid fa-angle-right"></i> ${r}</li>`)
            .join('');

          const rankersHtml = (item.recommended_rankers || [])
            .map(nick => `<button class="chip" onclick="copyNick('${nick}')">${nick} <i class="fa-regular fa-copy"></i></button>`)
            .join('');

          card.innerHTML = `
            <div class="card-top">
              <div class="formation-title">${item.formation} <span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">(${item.count}명)</span></div>
              <div class="formation-share">${item.share}%</div>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${item.share}%;"></div>
            </div>
            <div class="meta-section-title">핵심 전술 빌드업 루트</div>
            <ul class="routes-list">${routesHtml}</ul>
            <div class="meta-section-title">포지션별 핵심 1픽 선수</div>
            <div class="key-players">${playersHtml}</div>
            <div class="meta-section-title">실제 플레이 랭커 (클릭 시 복사)</div>
            <div class="ranker-chips">${rankersHtml}</div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('meta-container').innerHTML = `
          <div style="text-align: center; color: #ef4444; padding: 40px 0;">
            <p>메타 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
          </div>
        `;
      }
    }

    function copyNick(name) {
      navigator.clipboard.writeText(name).then(() => {
        const toast = document.getElementById('toast');
        toast.innerText = `'${name}' 구단주명이 복사되었습니다!`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    loadMeta();
  </script>
</body>
</html>
